name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build jacocoTestReport
      - name: Dogfood crap4j
        run: bash .github/scripts/dogfood.sh
      - name: Upload CRAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crap4j-reports
          path: build/crap4j-reports/*.json
          if-no-files-found: warn
