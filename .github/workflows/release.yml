name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag belongs to main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit on main." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify tag and project versions match
        id: version
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ -z "$release_version" || "$release_version" != "$project_version" ]]; then
            echo "Tag version '$release_version' does not match gradle.properties version '$project_version'." >&2
            exit 1
          fi
          if [[ ! "$release_version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$release_version' is not a valid release version (no 0.x, no snapshots, no pre-release suffixes)." >&2
            exit 1
          fi
          echo "value=$release_version" >> "$GITHUB_OUTPUT"

      - name: Build and test release artifacts
        run: ./gradlew build jacocoTestReport :cli:jar :cli:cyclonedxDirectBom

      - name: Stage GitHub Release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p build/release
          cp "cli/build/libs/crap4j-cli-${RELEASE_VERSION}.jar" \
            "build/release/crap4j-cli-${RELEASE_VERSION}.jar"
          cp cli/build/reports/cyclonedx-direct/bom.json \
            "build/release/crap4j-cli-${RELEASE_VERSION}-bom.cdx.json"

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: build/release/

  publish-central:
    name: Publish to Maven Central
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Publish 1.0.0 to Central for user-managed release
        id: publish-first-central-release
        if: needs.build.outputs.version == '1.0.0'
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: "true"
        run: |
          set -o pipefail
          publish_log="$RUNNER_TEMP/central-publish.log"
          ./gradlew publishToMavenCentral --no-parallel --console=plain 2>&1 | tee "$publish_log"

          deployment_id="$(sed -nE \
            's/.*deployment id: ([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}).*/\1/p' \
            "$publish_log" | tail -1)"
          if [[ ! "$deployment_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "Could not determine the Central deployment id from the Gradle output." >&2
            exit 1
          fi
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for first Central deployment validation
        if: needs.build.outputs.version == '1.0.0'
        shell: bash
        env:
          CENTRAL_DEPLOYMENT_ID: ${{ steps.publish-first-central-release.outputs.deployment-id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          central_token="$(printf '%s:%s' \
            "$MAVEN_CENTRAL_USERNAME" \
            "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$central_token"
          status_url="https://central.sonatype.com/api/v1/publisher/status?id=${CENTRAL_DEPLOYMENT_ID}"

          for attempt in {1..90}; do
            if ! status_json="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $central_token" \
              "$status_url")"; then
              echo "Central status request failed (attempt $attempt of 90); retrying." >&2
              sleep 10
              continue
            fi

            deployment_state="$(jq -r '.deploymentState // empty' <<< "$status_json")"
            case "$deployment_state" in
              VALIDATED)
                echo "Central deployment $CENTRAL_DEPLOYMENT_ID is validated."
                exit 0
                ;;
              FAILED)
                echo "Central validation failed for deployment $CENTRAL_DEPLOYMENT_ID:" >&2
                jq -c '.errors // "No error details available"' <<< "$status_json" >&2
                exit 1
                ;;
              PENDING|VALIDATING)
                echo "Central deployment state: $deployment_state (attempt $attempt of 90)."
                ;;
              *)
                echo "Unexpected Central deployment state '$deployment_state'." >&2
                jq -c . <<< "$status_json" >&2
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Central deployment $CENTRAL_DEPLOYMENT_ID did not validate within 15 minutes." >&2
          exit 1

      - name: Publish and release to Central
        # crap-0w4.17 is the operator gate that ensures 1.0.0 is published first.
        if: needs.build.outputs.version != '1.0.0'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: "true"
        run: ./gradlew publishAndReleaseToMavenCentral --no-parallel

  # If this job fails after publish-central succeeded, re-run only the failed
  # job from the Actions UI. Do not re-run the full workflow — Central uploads
  # are immutable and will reject a duplicate.
  publish-portal:
    name: Publish to Gradle Plugin Portal
    needs: [build, publish-central]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Publish Gradle plugin to the Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :gradle-plugin:publishPlugins

  github-release:
    name: Attest and release
    needs: [build, publish-portal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: build/release/

      - name: Attest CLI build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: build/release/crap4j-cli-${{ needs.build.outputs.version }}.jar

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "build/release/crap4j-cli-${RELEASE_VERSION}.jar"
          "build/release/crap4j-cli-${RELEASE_VERSION}-bom.cdx.json"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
