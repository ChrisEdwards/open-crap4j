name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Verify tag and project versions match
        id: version
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ -z "$release_version" || "$release_version" != "$project_version" ]]; then
            echo "Tag version '$release_version' does not match gradle.properties version '$project_version'." >&2
            exit 1
          fi
          if [[ ! "$release_version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$release_version' is not a valid release version (no 0.x, no snapshots, no pre-release suffixes)." >&2
            exit 1
          fi
          echo "value=$release_version" >> "$GITHUB_OUTPUT"

      - name: Build and test release artifacts
        run: ./gradlew build jacocoTestReport :cli:jar :cli:cyclonedxDirectBom

      - name: Stage GitHub Release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p build/release
          cp "cli/build/libs/crap4j-cli-${RELEASE_VERSION}.jar" \
            "build/release/crap4j-cli-${RELEASE_VERSION}.jar"
          cp cli/build/reports/cyclonedx-direct/bom.json \
            "build/release/crap4j-cli-${RELEASE_VERSION}-bom.cdx.json"

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: build/release/

  publish-central:
    name: Publish to Maven Central
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Publish 1.0.0 to Central for user-managed release
        if: needs.build.outputs.version == '1.0.0'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: "true"
        run: ./gradlew publishToMavenCentral --no-parallel

      - name: Publish and release to Central
        if: needs.build.outputs.version != '1.0.0'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: "true"
        run: ./gradlew publishAndReleaseToMavenCentral --no-parallel

  # If this job fails after publish-central succeeded, re-run only the failed
  # job from the Actions UI. Do not re-run the full workflow — Central uploads
  # are immutable and will reject a duplicate.
  publish-portal:
    name: Publish to Gradle Plugin Portal
    needs: [build, publish-central]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Publish Gradle plugin to the Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :gradle-plugin:publishPlugins

  github-release:
    name: Attest and release
    needs: [build, publish-portal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: build/release/

      - name: Attest CLI build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: build/release/crap4j-cli-${{ needs.build.outputs.version }}.jar

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "build/release/crap4j-cli-${RELEASE_VERSION}.jar"
          "build/release/crap4j-cli-${RELEASE_VERSION}-bom.cdx.json"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
